name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      # The version lives in the repo and must be committed BEFORE tagging.
      # Bumping it here instead would rewrite the manifest *after* the tag already
      # exists, so the tagged commit would never contain the version it released —
      # which is what triggered Obsidian's "Release manifest differs from repository
      # manifest version" warning. Verify instead of mutate.
      - name: Verify tag matches committed version
        run: |
          VERSION=${{ github.ref_name }}
          MANIFEST=$(node -p "require('./manifest.json').version")
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$VERSION manifest.json=$MANIFEST package.json=$PKG"
          if [ "$MANIFEST" != "$VERSION" ] || [ "$PKG" != "$VERSION" ]; then
            echo "::error::Tag $VERSION does not match manifest.json ($MANIFEST) or package.json ($PKG). Bump both, commit to main, then tag that commit."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Attest build artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            main.js
            styles.css
            manifest.json